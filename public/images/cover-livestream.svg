<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Live Streaming Wisuda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191918"/>
      <stop offset="0.55" stop-color="#111110"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A2B399" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#A2B399" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A2B399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.7" fill="#DCE6D6" fill-opacity="0.92"/>
    </pattern>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1.2" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="eye"><path d="M806 292 Q926 206 1046 292 Q926 378 806 292 Z"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="935" cy="300" r="330" fill="url(#glow)"/>
  <circle cx="935" cy="300" r="252" fill="none" stroke="#A2B399" stroke-opacity="0.26" stroke-width="1.2"/>
  <circle cx="935" cy="300" r="196" fill="none" stroke="#A2B399" stroke-opacity="0.14" stroke-width="1"/>

  <g transform="rotate(-3 935 300)">
    <rect x="762" y="168" width="346" height="264" rx="22" fill="#0b0b0b" stroke="#A2B399" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="778" y="184" width="314" height="232" rx="14" fill="#070707"/>
    <g clip-path="url(#eye)">
      <rect x="790" y="192" width="300" height="216" fill="url(#dots)"/>
      <rect x="790" y="192" width="300" height="216" fill="url(#scan)"/>
    </g>
    <ellipse cx="926" cy="292" rx="42" ry="48" fill="#080808"/>
    <ellipse cx="926" cy="292" rx="42" ry="48" fill="none" stroke="#A2B399" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="912" cy="274" r="9" fill="#DCE6D6" fill-opacity="0.8"/>
    <rect x="762" y="168" width="346" height="264" rx="22" fill="none" stroke="#A2B399" stroke-opacity="0.18" stroke-width="6" filter="url(#soft)"/>
  </g>

  <text x="84" y="150" fill="#A2B399" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="6" opacity="0.85">03</text>
  <line x1="88" y1="176" x2="196" y2="176" stroke="#A2B399" stroke-opacity="0.5"/>
  <text x="84" y="214" fill="#EFECE4" font-family="'Segoe UI', Arial, sans-serif" font-size="17" letter-spacing="5" opacity="0.62">LIVE STREAMING</text>

  <text x="84" y="560" fill="#F3F0E8" font-family="Georgia, 'Times New Roman', serif" font-size="78" letter-spacing="-1.5">Live Streaming</text>
  <text x="84" y="646" fill="#F3F0E8" font-family="Georgia, 'Times New Roman', serif" font-size="78" letter-spacing="-1.5">Wisuda</text>

  <line x1="88" y1="716" x2="500" y2="716" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="84" y="762" fill="#DCE6D6" font-family="'Segoe UI', Arial, sans-serif" font-size="21" letter-spacing="1.5" opacity="0.9">OBS ? Multi-Camera</text>
  <text x="84" y="828" fill="#EFECE4" font-family="'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4.5" opacity="0.42">SA'RUL IBAD ? SELECTED WORK</text>

  <text x="1130" y="852" fill="#A2B399" font-family="Georgia, 'Times New Roman', serif" font-size="290" text-anchor="end" opacity="0.055">03</text>
  <rect width="1200" height="900" filter="url(#noise)" opacity="0.05"/>
</svg>
