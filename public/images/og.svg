<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191918"/><stop offset=".6" stop-color="#111110"/><stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c8a26e" stop-opacity=".42"/><stop offset=".6" stop-color="#c8a26e" stop-opacity=".09"/><stop offset="1" stop-color="#c8a26e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
