    <clipPath id="eye"><path d="M878 312 Q990 232 1102 312 Q990 392 878 312 Z"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="990" cy="312" r="330" fill="url(#glow)"/>
  <circle cx="990" cy="312" r="236" fill="none" stroke="#a2b399" stroke-opacity=".26"/>
  <circle cx="990" cy="312" r="178" fill="none" stroke="#c8a26e" stroke-opacity=".16"/>

